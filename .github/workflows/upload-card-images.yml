name: Upload card images

on:
  workflow_dispatch:
    inputs:
      set_prefix:
        description: Card id prefix. Use ALL with card_ids to upload mixed sets. EB05 uploads that set only.
        required: true
        default: EB05
        type: string
      card_ids:
        description: Comma-separated card ids. Empty uses every index id with the prefix.
        required: false
        default: ""
        type: string
      overwrite:
        description: Replace existing PNG objects for the selected ids and regenerate w200, w320, and full WebP. Objects outside the list stay. Nothing is removed.
        required: true
        default: true
        type: boolean
      manifest_only:
        description: Skip download, PNG upload, and WebP. Rebuild the card-image manifest only.
        required: true
        default: false
        type: boolean
      image_source:
        description: Official image host. jp = Japanese cardlist only; default = asia-tc first, then JP, then EN.
        required: false
        default: jp
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install download dependencies
        if: ${{ inputs.manifest_only != true }}
        run: python -m pip install requests beautifulsoup4

      - name: Download official PNGs for the selected ids
        if: ${{ inputs.manifest_only != true }}
        env:
          SET_PREFIX: ${{ inputs.set_prefix }}
          CARD_IDS: ${{ inputs.card_ids }}
          IMAGE_SOURCE: ${{ inputs.image_source }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path

          import requests

          from sync_card_images import (
              JP_IMAGE_HOST,
              download_image,
              jp_image_stems,
              normalize_card_id,
              official_candidates,
          )

          prefix = os.environ.get("SET_PREFIX", "").strip().upper()
          source = os.environ.get("IMAGE_SOURCE", "jp").strip().lower() or "jp"
          wanted = {
              normalize_card_id(part)
              for part in os.environ.get("CARD_IDS", "").split(",")
              if part.strip()
          }
          wanted.discard("")
          if prefix in {"", "ALL", "*"} and not wanted:
              raise SystemExit("set_prefix ALL requires card_ids")
          index = json.loads(Path("index/cards_by_id.json").read_text(encoding="utf-8"))
          selected = []
          for raw_id, row in index.items():
              card_id = normalize_card_id(raw_id)
              if wanted:
                  if card_id not in wanted:
                      continue
              else:
                  if not prefix or not card_id.startswith(prefix):
                      continue
              if not isinstance(row, dict):
                  continue
              selected.append(card_id)
          selected = sorted(set(selected))
          if not selected:
              raise SystemExit("no index cards matched set_prefix/card_ids")
          if wanted and set(selected) != wanted:
              missing = sorted(wanted - set(selected))
              raise SystemExit("ids not in index: " + ",".join(missing))
          Path("packs").mkdir(exist_ok=True)
          session = requests.Session()
          session.trust_env = False
          failed = []
          for card_id in selected:
              if source == "jp":
                  candidates = [
                      f"{JP_IMAGE_HOST}images/cardlist/card/{stem}.png"
                      for stem in jp_image_stems(card_id)
                  ]
              else:
                  candidates = official_candidates(index[card_id])
              ok, url = False, ""
              for attempt in range(1, 4):
                  ok, url = download_image(card_id, candidates, session)
                  if ok:
                      break
                  time.sleep(2 * attempt)
              print(f"{card_id} {'ok' if ok else 'FAIL'} {url}", flush=True)
              if not ok:
                  failed.append(card_id)
          Path("selected-ids.txt").write_text(",".join(selected) + "\n", encoding="utf-8")
          print(f"selected {len(selected)} failed {len(failed)} source={source}", flush=True)
          if failed:
              raise SystemExit("download failed: " + ",".join(failed))
          manifest = json.loads(
              Path("frontend/src/generated/card-image-manifest.json").read_text(encoding="utf-8")
          )
          hash_mismatch = []
          for card_id in selected:
              fp = Path("packs") / f"{card_id}.png"
              if not fp.is_file():
                  hash_mismatch.append(f"{card_id}:missing")
                  continue
              got = hashlib.md5(fp.read_bytes()).hexdigest()[:8]
              expected = str(manifest.get(card_id) or "")
              if got != expected:
                  hash_mismatch.append(f"{card_id}:{got}!={expected}")
          if hash_mismatch:
              raise SystemExit("downloaded hash mismatch: " + ",".join(hash_mismatch))
          print("all downloaded hashes match the branch manifest", flush=True)
          PY

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy selected PNGs and image scripts to the VPS
        env:
          SET_PREFIX: ${{ inputs.set_prefix }}
          MANIFEST_ONLY: ${{ inputs.manifest_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
          ssh_base=(ssh "${ssh_opts[@]}")
          scp_base=(scp "${ssh_opts[@]}")
          target="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          "${ssh_base[@]}" "$target" "mkdir -p /opt/opcg/app/packs /opt/opcg/app/scripts /opt/opcg/app/frontend/src/generated"
          "${scp_base[@]}" \
            scripts/copy_new_pack_images_to_r2.py \
            scripts/generate_card_webp.py \
            scripts/build_card_image_manifest.py \
            "$target:/opt/opcg/app/scripts/"
          if [ "$MANIFEST_ONLY" = "true" ]; then
            echo "manifest_only: skipped PNG copy"
            exit 0
          fi
          # Only the downloaded <ID>.png names. Other packs files on the VPS stay.
          mapfile -t pngs < <(find packs -maxdepth 1 -type f -name '*.png' | sort)
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "no pngs downloaded"
            exit 1
          fi
          "${scp_base[@]}" "${pngs[@]}" "$target:/opt/opcg/app/packs/"
          "${scp_base[@]}" selected-ids.txt "$target:/tmp/opcg-selected-ids.txt"

      - name: Upload PNG and WebP variants on the VPS
        env:
          SET_PREFIX: ${{ inputs.set_prefix }}
          OVERWRITE: ${{ inputs.overwrite }}
          MANIFEST_ONLY: ${{ inputs.manifest_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "SET_PREFIX='$SET_PREFIX' OVERWRITE='$OVERWRITE' MANIFEST_ONLY='$MANIFEST_ONLY' bash -s" << 'REMOTE'
          set -euo pipefail
          cd /opt/opcg/app
          case "$SET_PREFIX" in
            ALL|all|'*'|'') SET_PREFIX="" ;;
          esac
          remote="$(grep -E '^OPCG_R2_RCLONE_REMOTE=' .env | tail -n 1 | cut -d= -f2- | tr -d '"' | tr -d "'")"
          if [ -z "$remote" ]; then
            echo "OPCG_R2_RCLONE_REMOTE is empty"
            exit 1
          fi
          webp_rc=0
          if [ "$MANIFEST_ONLY" != "true" ]; then
            ids="$(tr -d '\n' < /tmp/opcg-selected-ids.txt)"
            copy_args=(scripts/copy_new_pack_images_to_r2.py --packs packs --rclone-remote "$remote" --ids "$ids")
            webp_args=(scripts/generate_card_webp.py --packs packs --rclone-remote "$remote" --ids "$ids")
            if [ -n "$SET_PREFIX" ]; then
              copy_args+=(--set-prefix "$SET_PREFIX")
              webp_args+=(--set-prefix "$SET_PREFIX")
            fi
            if [ "$OVERWRITE" = "true" ]; then
              copy_args+=(--overwrite)
              webp_args+=(--force)
            fi
            .venv/bin/python -u "${copy_args[@]}"
            .venv/bin/python -u "${webp_args[@]}" || webp_rc=$?
            if [ "$webp_rc" -ne 0 ]; then
              echo "generate card webp FAILED rc=$webp_rc; continuing to card image manifest"
            fi
          fi
          .venv/bin/python -u scripts/build_card_image_manifest.py --rclone-remote "$remote"
          if [ "$webp_rc" -ne 0 ]; then
            exit "$webp_rc"
          fi
          REMOTE
