name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_API_BASE_URL: https://api.optcgassistant.com
  NEXT_PUBLIC_PACKS_CDN_URL: https://img.optcgassistant.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Production build runs on this runner, not on the VPS. The daily sync
      # writes the manifest on the VPS from R2 bytes. Pull that file before
      # `npm run build`, then add keys that exist only in the committed
      # snapshot. Entries already on the VPS keep the VPS hash. Nothing is
      # deleted. A missing file (first deploy) keeps the committed snapshot
      # and warns. Any other SSH or copy error fails the job. rsync never
      # replaces a manifest that already exists; a later step writes back
      # only the keys the VPS was missing.
      - name: Pull card image manifest from VPS
        run: |
          set -euo pipefail
          dest="frontend/src/generated/card-image-manifest.json"
          remote_path="/opt/opcg/app/frontend/src/generated/card-image-manifest.json"
          repo_snapshot="${RUNNER_TEMP}/card-image-manifest.repo.json"
          cp "$dest" "$repo_snapshot"
          ssh_base=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          target="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          status="$("${ssh_base[@]}" "$target" "if [ -f '$remote_path' ]; then printf present; else printf absent; fi")"
          if [ "$status" = present ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$target:$remote_path" "$dest"
            python3 scripts/build_card_image_manifest.py \
              --merge-missing-from "$repo_snapshot" \
              --output "$dest"
            echo "using the VPS card-image manifest plus repo-only entries for this build"
          elif [ "$status" = absent ]; then
            echo "::warning::VPS has no card-image-manifest.json yet; this build uses the committed snapshot"
          else
            echo "error: unexpected manifest probe result: ${status}"
            exit 1
          fi
          sha256sum "$dest"
          python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))), "manifest entries")' "$dest"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build
          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public

      # index/card_effects.json is generated on the server by
      # scripts/compile_card_effects.py. The committed copy is a 0-byte
      # placeholder, so it must not be uploaded. The same excludes cover
      # .tmp/.new siblings and the atomic writer's index/.card_effects.json.*.tmp
      # files. This rsync does not use --delete; exclude (without
      # --delete-excluded) is what would also keep those paths if --delete
      # is added later.
      - name: "Sync backend code (no --delete, keeps server-only files like packs/, .env, dbs)"
        run: |
          rsync -avz \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'packs/' --exclude 'preview/images/' \
            --exclude 'frontend/node_modules/' --exclude 'frontend/.next/' \
            --exclude 'meta/*.db' --exclude 'meta/*.db-*' \
            --exclude 'meta/user_*.json' --exclude 'meta/binder_shares.json' \
            --exclude 'meta/replays/' --exclude 'meta/logs/' \
            --exclude 'meta/market_prices.json' --exclude 'meta/yuyu_sync_cursor.json' \
            --exclude 'meta/photo_hash_index.json' --exclude 'meta/photo_clip_index.npz' \
            --exclude 'meta/*.log' \
            --exclude 'cards/cards/' --exclude 'cards/official_sync/' \
            --exclude 'frontend/src/generated/card-image-manifest.json' \
            --exclude 'index/card_effects.json' \
            --exclude 'index/card_effects.json.tmp' \
            --exclude 'index/card_effects.json.new' \
            --exclude 'index/.card_effects.json.*.tmp' \
            --exclude '.venv' --exclude '__pycache__/' --exclude '*.pyc' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/opcg/app/"

      # The code sync excludes the manifest. If the VPS file is missing, seed
      # the committed snapshot. If it exists, re-read it and add committed
      # keys it still does not have. Re-reading avoids overwriting a daily
      # sync that landed during this job. Existing entries stay as they are.
      # The file is uploaded only when at least one key was added.
      - name: Add repo-only card image manifest entries on the VPS
        run: |
          set -euo pipefail
          remote_path="/opt/opcg/app/frontend/src/generated/card-image-manifest.json"
          repo_snapshot="${RUNNER_TEMP}/card-image-manifest.repo.json"
          vps_copy="${RUNNER_TEMP}/card-image-manifest.vps.json"
          target="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          if [ ! -f "$repo_snapshot" ]; then
            echo "error: committed manifest snapshot is missing"
            exit 1
          fi
          status="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$target" "if [ -f '$remote_path' ]; then printf present; else printf absent; fi")"
          if [ "$status" = present ]; then
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$target:$remote_path" "$vps_copy"
            log="$(python3 scripts/build_card_image_manifest.py \
              --merge-missing-from "$repo_snapshot" \
              --output "$vps_copy")"
            printf '%s\n' "$log"
            added="$(printf '%s\n' "$log" | awk '/^added / { print $2; exit }')"
            if [ "${added:-0}" != "0" ]; then
              scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
                "$vps_copy" "$target:$remote_path"
              echo "wrote ${added} repo-only manifest entries onto the VPS"
            else
              echo "VPS manifest already has every committed entry; left it unchanged"
            fi
          elif [ "$status" = absent ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$target" "mkdir -p /opt/opcg/app/frontend/src/generated"
            scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
              "$repo_snapshot" "$target:$remote_path"
            echo "seeded the VPS manifest from the committed snapshot"
          else
            echo "error: unexpected manifest probe result: ${status}"
            exit 1
          fi

      # Stage the new standalone tree beside the live one. rsync --delete onto the
      # directory the running server is serving makes Next answer 400 for chunks
      # it still has in memory. Promotion (after the API is up) switches symlinks
      # and keeps the previous build's /_next/static files for one generation.
      - name: "Sync frontend build into a new release directory"
        run: |
          release="${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          dest="/opt/opcg/app/frontend/.next/releases/${release}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${dest}/standalone'"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/.next/standalone/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${dest}/standalone/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/public/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/opcg/app/frontend/public/"

      - name: Install backend deps + restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            bash -s << 'EOF'
          set -euo pipefail
          cd /opt/opcg/app
          .venv/bin/pip install -q -r requirements.txt
          cp deploy/optcgassistant/opcg-api.service /etc/systemd/system/opcg-api.service
          cp deploy/optcgassistant/opcg-web.service /etc/systemd/system/opcg-web.service
          systemctl daemon-reload
          systemctl restart opcg-api || { journalctl -u opcg-api -n 50 --no-pager || true; exit 1; }
          bash deploy/optcgassistant/wait-http.sh http://127.0.0.1:8000/ opcg-api
          bash deploy/optcgassistant/promote-frontend.sh '${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}'
          systemctl restart opcg-web || { journalctl -u opcg-web -n 50 --no-pager || true; exit 1; }
          bash deploy/optcgassistant/wait-http.sh http://127.0.0.1:3000/ opcg-web
          EOF

      # Read-only. Missing or 0-byte card_effects.json is a warning, not a
      # failure: do not delete the file and do not run compile_card_effects.py.
      - name: Warn if server card_effects.json is missing or empty
        run: |
          remote_path="/opt/opcg/app/index/card_effects.json"
          target="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          if ! status="$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 \
            "$target" "if [ ! -e '$remote_path' ]; then printf missing; elif [ ! -s '$remote_path' ]; then printf empty; else printf ok; fi")"; then
            status="probe-failed"
          fi
          case "$status" in
            ok)
              echo "card_effects.json is present and non-empty on the server; this deploy did not modify it"
              ;;
            missing)
              echo "::warning title=card_effects.json missing::/opt/opcg/app/index/card_effects.json is missing. This deploy did not create, delete, or regenerate it."
              echo "WARNING: /opt/opcg/app/index/card_effects.json is missing. Deploy left it untouched and did not regenerate it."
              ;;
            empty)
              echo "::warning title=card_effects.json empty::/opt/opcg/app/index/card_effects.json is 0 bytes. This deploy did not overwrite, delete, or regenerate it."
              echo "WARNING: /opt/opcg/app/index/card_effects.json is 0 bytes. Deploy left it untouched and did not regenerate it."
              ;;
            *)
              echo "::warning title=card_effects.json check inconclusive::Could not confirm /opt/opcg/app/index/card_effects.json (probe: ${status}). Deploy continues without changing the file."
              echo "WARNING: card_effects.json size check was inconclusive (${status}). Deploy continues; the file was not modified."
              ;;
          esac
          exit 0

      - name: Smoke test
        run: |
          curl -sSf https://api.optcgassistant.com/ | head -c 500
          echo
          curl -sSf -o /dev/null -w "frontend: %{http_code}\n" https://optcgassistant.com

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
